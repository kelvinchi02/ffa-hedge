name: CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -s requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pandas pytest pytest-cov
          fi

      - name: Run tests
        run: pytest -q --cov=ffa_engine.streaming --cov=ffa_engine.database --cov=ffa_engine.strategies --cov=ffa_engine.optimization --cov=ffa_engine.main --cov-branch --cov-report=term-missing --cov-fail-under=100

  release:
    name: Release Artifact
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release bundle
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/ffa-hedge-${{ github.ref_name }}.zip HEAD

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.ref_name }}
          path: dist/ffa-hedge-${{ github.ref_name }}.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ffa-hedge-${{ github.ref_name }}.zip
          generate_release_notes: true